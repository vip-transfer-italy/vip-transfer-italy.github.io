name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'   # weekly rebuild (fresh sitemap dates)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        env:
          # Settings → Secrets and variables → Actions → Variables (all optional)
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          GA_ID: ${{ vars.GA_ID }}
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
