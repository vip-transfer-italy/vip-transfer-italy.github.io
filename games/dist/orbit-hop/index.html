<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orbit Hop</title>
<style>
:root{color-scheme:dark;background:#070b1a}
html,body{height:100%;margin:0;background:#070b1a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;cursor:pointer}
</style>
<canvas id="c" aria-label="Orbit Hop game. Tap or press Space to launch."></canvas>
<script>
/* shared helpers — inlined into every game by build.sh */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(typeof onResize==='function')onResize();}
window.addEventListener('resize',resize);
const store={get(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
let AC=null,muted=false;
function beep(f,d,type,vol){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.1));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||.1));}catch(e){}}
function rnd(a,b){return a+Math.random()*(b-a)}
/* Ads adapter: on CrazyGames it loads their SDK; everywhere else it is a no-op */
const Ads={sdk:null,count:0,
 init(){if(!/crazygames/i.test(location.hostname))return;const s=document.createElement('script');s.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';s.onload=async()=>{try{await window.CrazyGames.SDK.init();Ads.sdk=window.CrazyGames.SDK;}catch(e){}};document.head.appendChild(s);},
 start(){try{this.sdk&&this.sdk.game.gameplayStart()}catch(e){}},
 stop(){try{this.sdk&&this.sdk.game.gameplayStop()}catch(e){}},
 between(cb){this.count++;if(!this.sdk||this.count%2){cb();return}let done=false;const fin=()=>{if(done)return;done=true;muted=false;cb()};
  try{this.sdk.ad.requestAd('midgame',{adStarted(){muted=true},adFinished:fin,adError:fin})}catch(e){fin()}}};
Ads.init();
function loop(update,draw){let last=performance.now(),paused=false;
 document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=performance.now()});
 function f(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(!paused)update(dt);draw();requestAnimationFrame(f)}
 resize();requestAnimationFrame(f);}
function text(s,x,y,size,color,align,weight){ctx.font=(weight||700)+' '+size+'px "Trebuchet MS",system-ui,sans-serif';ctx.fillStyle=color;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}

let state='menu',score=0,best=store.get('orbithop_best'),planets=[],pl=null,camY=0,parts=[],overT=0,ox=0,PW=480;
const stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random(),y:Math.random(),d:rnd(.1,.6),s:rnd(.5,1.8)});
function onResize(){PW=Math.min(W,480);ox=(W-PW)/2;for(const p of planets)p.x=Math.max(p.r+12,Math.min(PW-p.r-12,p.x))}
function makePlanet(prev,lvl){const r=Math.max(16,rnd(22,34)-Math.min(10,lvl*.18));
 return{x:prev?rnd(50,PW-50):PW/2,y:prev?prev.y-rnd(170,225):0,r,
  spin:(Math.random()<.5?-1:1)*rnd(1.7,2.3)*(1+Math.min(lvl,50)*.018),
  vx:lvl>6&&Math.random()<Math.min(.65,lvl*.025)?rnd(35,85)*(Math.random()<.5?-1:1):0,
  hue:(lvl*47+200)%360}}
function reset(){planets=[];for(let i=0;i<8;i++)planets.push(makePlanet(planets[i-1],i));
 pl={p:0,a:-Math.PI/2,fly:false,x:0,y:0,vx:0,vy:0,trail:[]};score=0;parts=[];camY=planets[0].y-H*.72;}
resize();reset();
function burst(x,y,hue,n){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(40,200);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.4,.8),hue})}}
function press(){
 if(state==='menu'){state='play';Ads.start();beep(520,.08);return}
 if(state==='over'){if(overT<.5)return;Ads.between(()=>{reset();state='play';Ads.start()});return}
 if(!pl.fly){pl.fly=true;pl.vx=Math.cos(pl.a)*540;pl.vy=Math.sin(pl.a)*540;pl.t=0;beep(330,.07,'triangle')}}
window.addEventListener('pointerdown',e=>{e.preventDefault();press()});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();press()}if(e.code==='KeyM')muted=!muted});
function die(){state='over';overT=0;Ads.stop();if(score>best){best=score;store.set('orbithop_best',best)}burst(pl.x,pl.y,0,30);beep(140,.35,'sawtooth',.06)}
function update(dt){
 for(const p of planets){if(p.vx){p.x+=p.vx*dt;if(p.x<p.r+12||p.x>PW-p.r-12){p.vx*=-1;p.x=Math.max(p.r+12,Math.min(PW-p.r-12,p.x))}}}
 if(state==='over')overT+=dt;
 if(state!=='over'){
  if(!pl.fly){const p=planets[pl.p];pl.a+=p.spin*dt*(state==='menu'?.6:1);pl.x=p.x+Math.cos(pl.a)*(p.r+9);pl.y=p.y+Math.sin(pl.a)*(p.r+9)}
  else{pl.x+=pl.vx*dt;pl.y+=pl.vy*dt;pl.t+=dt;
   for(let i=pl.p+1;i<Math.min(planets.length,pl.p+4);i++){const p=planets[i];if(Math.hypot(pl.x-p.x,pl.y-p.y)<p.r+10){
     score+=i-pl.p;pl.p=i;pl.fly=false;pl.a=Math.atan2(pl.y-p.y,pl.x-p.x);burst(pl.x,pl.y,p.hue,14);beep(600+Math.min(score,30)*20,.09);
     while(planets.length<pl.p+8)planets.push(makePlanet(planets[planets.length-1],planets.length));break}}
   const sy=pl.y-camY;if(pl.fly&&(pl.x<-20||pl.x>PW+20||sy<-40||sy>H+40||pl.t>2.2))die()}
  const ty=planets[pl.p].y-H*.72;camY+=(ty-camY)*Math.min(1,dt*3.5)}
 pl.trail.push({x:pl.x,y:pl.y});if(pl.trail.length>14)pl.trail.shift();
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.l-=dt}parts=parts.filter(q=>q.l>0);
}
function draw(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1030');g.addColorStop(1,'#05060f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const s of stars){const y=((s.y*H-camY*s.d)%H+H)%H;ctx.fillStyle='rgba(200,215,255,'+(s.d+.2)+')';ctx.fillRect(s.x*W,y,s.s,s.s)}
 ctx.save();ctx.translate(ox,-camY);
 if(state!=='over'&&!pl.fly){const p=planets[pl.p];ctx.strokeStyle='rgba(255,255,255,.12)';ctx.setLineDash([3,6]);ctx.beginPath();ctx.arc(p.x,p.y,p.r+9,0,6.29);ctx.stroke();
  ctx.strokeStyle='rgba(255,230,140,.55)';ctx.beginPath();ctx.moveTo(pl.x,pl.y);ctx.lineTo(pl.x+Math.cos(pl.a)*70,pl.y+Math.sin(pl.a)*70);ctx.stroke();ctx.setLineDash([])}
 for(let i=0;i<planets.length;i++){const p=planets[i],sy=p.y-camY;if(sy<-80||sy>H+80)continue;
  const rg=ctx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.35,p.r*.1,p.x,p.y,p.r);rg.addColorStop(0,'hsl('+p.hue+',85%,72%)');rg.addColorStop(1,'hsl('+p.hue+',70%,32%)');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.29);ctx.fill();
  if(i<pl.p){ctx.fillStyle='rgba(5,6,15,.55)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.29);ctx.fill()}
  if(p.vx){ctx.strokeStyle='hsla('+p.hue+',90%,70%,.5)';ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.5,p.r*.45,-.3,0,6.29);ctx.stroke()}}
 for(let i=0;i<pl.trail.length;i++){const t=pl.trail[i];ctx.fillStyle='rgba(255,220,120,'+(i/pl.trail.length*.5)+')';ctx.beginPath();ctx.arc(t.x,t.y,2+i*.3,0,6.29);ctx.fill()}
 if(state!=='over'){ctx.shadowColor='#ffd76a';ctx.shadowBlur=16;ctx.fillStyle='#fff4c8';ctx.beginPath();ctx.arc(pl.x,pl.y,7,0,6.29);ctx.fill();ctx.shadowBlur=0}
 for(const q of parts){ctx.fillStyle='hsla('+q.hue+',90%,70%,'+Math.max(0,q.l*1.4)+')';ctx.fillRect(q.x-2,q.y-2,4,4)}
 ctx.restore();
 if(state==='play')text(String(score),W/2,56,46,'#fff');
 if(state==='menu'){ctx.fillStyle='rgba(5,6,15,.55)';ctx.fillRect(0,0,W,H);text('ORBIT HOP',W/2,H*.26,Math.min(56,W*.12),'#ffe08a');text('Tap to launch. Land on the next planet.',W/2,H*.26+48,16,'#b8c2e8',null,400);
  text('Best: '+best,W/2,H*.26+78,16,'#8792bd',null,400);text('Tap to start',W/2,H*.26+118,18,'#fff',null,500)}
 if(state==='over'){ctx.fillStyle='rgba(5,6,15,.6)';ctx.fillRect(0,0,W,H);text('LOST IN SPACE',W/2,H*.36,Math.min(40,W*.09),'#ff9a7a');
  text(String(score),W/2,H*.36+62,64,'#fff');text('Best: '+best,W/2,H*.36+112,18,'#b8c2e8',null,400);
  if(overT>.5)text('Tap to try again',W/2,H*.36+156,18,'#ffe08a',null,500)}
}
loop(update,draw);
</script>
</html>
