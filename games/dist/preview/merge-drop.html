<title>Merge Drop</title>
<style>
:root{color-scheme:dark;background:#12101f}
html,body{height:100%;margin:0;background:#12101f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;cursor:pointer}
</style>
<canvas id="c" aria-label="Merge Drop game. Tap a column or press 1 to 5 to drop a block."></canvas>
<script>
/* shared helpers — inlined into every game by build.sh */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(typeof onResize==='function')onResize();}
window.addEventListener('resize',resize);
const store={get(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
let AC=null,muted=false;
function beep(f,d,type,vol){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.1));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||.1));}catch(e){}}
function rnd(a,b){return a+Math.random()*(b-a)}
/* Ads adapter: on CrazyGames it loads their SDK; everywhere else it is a no-op */
const Ads={sdk:null,count:0,
 init(){if(!/crazygames/i.test(location.hostname))return;const s=document.createElement('script');s.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';s.onload=async()=>{try{await window.CrazyGames.SDK.init();Ads.sdk=window.CrazyGames.SDK;}catch(e){}};document.head.appendChild(s);},
 start(){try{this.sdk&&this.sdk.game.gameplayStart()}catch(e){}},
 stop(){try{this.sdk&&this.sdk.game.gameplayStop()}catch(e){}},
 between(cb){this.count++;if(!this.sdk||this.count%2){cb();return}let done=false;const fin=()=>{if(done)return;done=true;muted=false;cb()};
  try{this.sdk.ad.requestAd('midgame',{adStarted(){muted=true},adFinished:fin,adError:fin})}catch(e){fin()}}};
Ads.init();
function loop(update,draw){let last=performance.now(),paused=false;
 document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=performance.now()});
 function f(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(!paused)update(dt);draw();requestAnimationFrame(f)}
 resize();requestAnimationFrame(f);}
function text(s,x,y,size,color,align,weight){ctx.font=(weight||700)+' '+size+'px "Trebuchet MS",system-ui,sans-serif';ctx.fillStyle=color;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}

const COLS=5,ROWS=7;
let grid,state='menu',score=0,best=store.get('mergedrop_best'),bestTile=2,next=2,after=4,busy=false,pending=new Set(),hover=2,parts=[],overT=0,shake=0,combo=0;
let cell=60,bx=0,by=0;
function onResize(){cell=Math.floor(Math.min((W-24)/COLS,(H-190)/ROWS,86));bx=(W-cell*COLS)/2;by=Math.max(150,(H-cell*ROWS)/2+50)}
function pick(){let mx=1;for(const col of grid)for(const b of col)if(b)mx=Math.max(mx,Math.log2(b.v));
 const top=Math.max(3,Math.min(6,mx-2));const w=[];for(let e=1;e<=top;e++)w.push([e,top-e+1.5]);
 let t=Math.random()*w.reduce((s,x)=>s+x[1],0);for(const [e,x] of w){t-=x;if(t<=0)return 2**e}return 2}
function reset(){grid=[...Array(COLS)].map(()=>Array(ROWS).fill(null));score=0;bestTile=2;busy=false;pending=new Set();parts=[];next=pick();after=pick()}
resize();reset();
function color(v){const e=Math.log2(v);return'hsl('+((e*41+190)%360)+',72%,'+(58-Math.min(e,14))+'%)'}
function label(v){return v>=1e6?Math.round(v/1e6)+'M':v>=1e4?Math.round(v/1e3)+'K':String(v)}
function drop(c){
 if(state==='menu'){state='play';Ads.start();return}
 if(state==='over'){if(overT<.6)return;Ads.between(()=>{reset();state='play';Ads.start()});return}
 if(busy)return;let r=-1;for(let i=ROWS-1;i>=0;i--)if(!grid[c][i]){r=i;break}
 if(r<0){shake=.25;beep(110,.12,'square',.04);return}
 const b={v:next,y:-1,s:1};grid[c][r]=b;pending=new Set([b]);busy=true;combo=0;next=after;after=pick();beep(300,.05,'triangle')}
function colAt(x){return Math.max(0,Math.min(COLS-1,Math.floor((x-bx)/cell)))}
window.addEventListener('pointerdown',e=>{e.preventDefault();hover=colAt(e.clientX);drop(hover)});
window.addEventListener('pointermove',e=>{hover=colAt(e.clientX)});
window.addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=COLS){hover=n-1;drop(hover)}
 else if(e.code==='ArrowLeft')hover=Math.max(0,hover-1);else if(e.code==='ArrowRight')hover=Math.min(COLS-1,hover+1);
 else if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowDown'){e.preventDefault();drop(hover)}else if(e.code==='KeyM')muted=!muted});
function find(b){for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)if(grid[c][r]===b)return[c,r];return null}
function burst(c,r,v){const x=bx+(c+.5)*cell,y=by+(r+.5)*cell;for(let i=0;i<10;i++){const a=rnd(0,6.28),s=rnd(60,220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.6),col:color(v)})}}
function step(){
 const merged=new Set();
 for(const b of pending){const pos=find(b);if(!pos)continue;const[c,r]=pos;
  const ns=[[c-1,r],[c+1,r],[c,r+1],[c,r-1]].filter(([x,y])=>x>=0&&x<COLS&&y>=0&&y<ROWS&&grid[x][y]&&grid[x][y]!==b&&grid[x][y].v===b.v);
  if(ns.length){for(const[x,y]of ns){burst(x,y,b.v);pending.delete(grid[x][y]);grid[x][y]=null}
   b.v*=2**ns.length;b.s=1.35;score+=b.v;bestTile=Math.max(bestTile,b.v);merged.add(b);combo++;beep(380+combo*90,.12,'sine',.08)}}
 if(!merged.size){busy=false;pending=new Set();if(grid.every(col=>col[0])){state='over';overT=0;Ads.stop();if(score>best){best=score;store.set('mergedrop_best',best)}beep(150,.4,'sawtooth',.05)}return}
 const moved=new Set(merged);
 for(let c=0;c<COLS;c++){let w=ROWS-1;for(let r=ROWS-1;r>=0;r--){const b=grid[c][r];if(b){if(r!==w){grid[c][w]=b;grid[c][r]=null;moved.add(b)}w--}}}
 pending=moved}
function update(dt){
 let settled=true;
 for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const b=grid[c][r];if(!b)continue;const d=r-b.y;
  if(Math.abs(d)>.001){b.y+=Math.sign(d)*Math.min(Math.abs(d),dt*18);settled=false}b.s+=(1-b.s)*Math.min(1,dt*10);if(Math.abs(b.s-1)>.05)settled=false}
 if(busy&&settled)step();
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=400*dt;q.l-=dt}parts=parts.filter(q=>q.l>0);
 shake=Math.max(0,shake-dt);if(state==='over')overT+=dt}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function block(x,y,v,size,alpha){ctx.globalAlpha=alpha||1;ctx.fillStyle=color(v);rr(x,y,size,size,size*.18);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.18)';rr(x+3,y+3,size-6,size*.32,size*.14);ctx.fill();
 text(label(v),x+size/2,y+size/2+1,size*(label(v).length>3?.3:.4),'#fff');ctx.globalAlpha=1}
function draw(){
 ctx.fillStyle='#12101f';ctx.fillRect(0,0,W,H);
 const sx=shake?rnd(-4,4):0;ctx.save();ctx.translate(sx,0);
 text('SCORE',bx,28,12,'#8f88b8','left',600);text(String(score),bx,52,28,'#fff','left');
 text('BEST',bx+cell*COLS,28,12,'#8f88b8','right',600);text(String(best),bx+cell*COLS,52,28,'#ffd36e','right');
 const ns=cell*.8;text('NEXT',W/2,26,12,'#8f88b8',null,600);block(W/2-ns/2,40,next,ns);block(W/2+ns/2+10,40+ns*.25,after,ns*.5,.6);
 ctx.fillStyle='#1c1830';rr(bx-6,by-6,cell*COLS+12,cell*ROWS+12,14);ctx.fill();
 if(state==='play'&&!busy){ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(bx+hover*cell,by,cell,cell*ROWS)}
 ctx.fillStyle='rgba(255,90,90,.08)';ctx.fillRect(bx,by,cell*COLS,cell);
 for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const b=grid[c][r];
  if(!b){ctx.fillStyle='rgba(255,255,255,.03)';rr(bx+c*cell+4,by+r*cell+4,cell-8,cell-8,8);ctx.fill();continue}
  const s=(cell-6)*b.s,x=bx+c*cell+cell/2-s/2,y=by+b.y*cell+cell/2-s/2;block(x,y,b.v,s)}
 for(const q of parts){ctx.globalAlpha=Math.max(0,q.l*2);ctx.fillStyle=q.col;ctx.fillRect(q.x-3,q.y-3,6,6)}ctx.globalAlpha=1;
 ctx.restore();
 if(state==='menu'){ctx.fillStyle='rgba(18,16,31,.82)';ctx.fillRect(0,0,W,H);text('MERGE DROP',W/2,H*.32,Math.min(52,W*.11),'#ffd36e');
  text('Drop blocks. Equal neighbours merge.',W/2,H*.32+48,16,'#c9c3ea',null,400);text('Don\'t let every column fill up.',W/2,H*.32+72,16,'#c9c3ea',null,400);
  text('Tap to start',W/2,H*.32+118,18,'#fff',null,500)}
 if(state==='over'){ctx.fillStyle='rgba(18,16,31,.82)';ctx.fillRect(0,0,W,H);text('BOARD FULL',W/2,H*.32,Math.min(44,W*.1),'#ff8f8f');
  text(String(score),W/2,H*.32+62,60,'#fff');text('Biggest block: '+label(bestTile)+'   Best: '+best,W/2,H*.32+110,16,'#c9c3ea',null,400);
  if(overT>.6)text('Tap to play again',W/2,H*.32+150,18,'#ffd36e',null,500)}
}
loop(update,draw);
</script>
