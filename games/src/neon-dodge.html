<title>Neon Dodge</title>
<style>
:root{color-scheme:dark;background:#05030c}
html,body{height:100%;margin:0;background:#05030c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
</style>
<canvas id="c" aria-label="Neon Dodge game. Drag or use arrow keys to dodge."></canvas>
<script>
/*@COMMON@*/
let state='menu',t=0,gems=0,score=0,best=store.get('neondodge_best'),ship,obs=[],items=[],parts=[],spawnT=0,gemT=2,shieldT=12,overT=0,keys={},grid=0;
function reset(){ship={x:W/2,tx:W/2,y:H-90,shield:false,inv:0};obs=[];items=[];parts=[];t=0;gems=0;score=0;spawnT=.6;gemT=2;shieldT=12}
function onResize(){if(ship){ship.y=H-90;ship.x=Math.min(W-20,ship.x);ship.tx=Math.min(W-20,ship.tx)}}
resize();reset();
function start(){if(state==='menu'){state='play';Ads.start();beep(500,.08);return true}
 if(state==='over'){if(overT>.6)Ads.between(()=>{reset();state='play';Ads.start()});return true}return false}
window.addEventListener('pointerdown',e=>{e.preventDefault();if(!start())ship.tx=e.clientX});
window.addEventListener('pointermove',e=>{if(state==='play')ship.tx=e.clientX});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();start()}if(e.code==='KeyM')muted=!muted});
window.addEventListener('keyup',e=>{keys[e.code]=false});
function burst(x,y,hue,n,sp){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(40,sp||260);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.8),hue})}}
function spawn(){const lvl=Math.min(1,t/90);const size=rnd(14,30+lvl*16);const kind=Math.random()<.5?'sq':Math.random()<.5?'tri':'ring';
 obs.push({x:rnd(size,W-size),y:-40,size,vy:rnd(170,230)+t*5,vx:Math.random()<.2+lvl*.3?rnd(-90,90):0,rot:0,vr:rnd(-3,3),kind,hue:[320,190,45,275][Math.floor(Math.random()*4)]})}
function update(dt){
 grid=(grid+dt*(state==='play'?120+t*3:40))%40;
 if(state==='play'){t+=dt;
  if(keys.ArrowLeft||keys.KeyA)ship.tx-=520*dt;if(keys.ArrowRight||keys.KeyD)ship.tx+=520*dt;
  ship.tx=Math.max(16,Math.min(W-16,ship.tx));ship.x+=(ship.tx-ship.x)*Math.min(1,dt*14);ship.inv=Math.max(0,ship.inv-dt);
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.2,.75-t*.007)*rnd(.7,1.2)}
  gemT-=dt;if(gemT<=0){items.push({x:rnd(20,W-20),y:-20,vy:170+t*2,k:'gem'});gemT=rnd(1.6,3)}
  shieldT-=dt;if(shieldT<=0){items.push({x:rnd(30,W-30),y:-20,vy:150,k:'shield'});shieldT=rnd(14,20)}
  for(const o of obs){o.y+=o.vy*dt;o.x+=o.vx*dt;if(o.x<o.size||o.x>W-o.size)o.vx*=-1;o.rot+=o.vr*dt;
   if(!o.dead&&Math.hypot(o.x-ship.x,o.y-ship.y)<o.size*.55+11&&ship.inv<=0){
    if(ship.shield){ship.shield=false;ship.inv=1;o.dead=true;burst(o.x,o.y,o.hue,20);beep(220,.2,'square',.05)}
    else{state='over';overT=0;Ads.stop();burst(ship.x,ship.y,190,40,320);beep(120,.45,'sawtooth',.06);score=Math.floor(t*10)+gems*25;if(score>best){best=score;store.set('neondodge_best',best)}}}}
  for(const it of items){it.y+=it.vy*dt;if(!it.got&&Math.hypot(it.x-ship.x,it.y-ship.y)<24){it.got=true;
   if(it.k==='gem'){gems++;burst(it.x,it.y,160,10,150);beep(880,.08,'sine',.06)}else{ship.shield=true;burst(it.x,it.y,200,14,160);beep(660,.2,'triangle',.06)}}}
  score=Math.floor(t*10)+gems*25}
 obs=obs.filter(o=>!o.dead&&o.y<H+60);items=items.filter(i=>!i.got&&i.y<H+30);
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;q.l-=dt}parts=parts.filter(q=>q.l>0);
 if(state==='over')overT+=dt}
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b}
function draw(){
 ctx.fillStyle='#05030c';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(140,60,255,.16)';ctx.lineWidth=1;ctx.beginPath();
 for(let y=grid-40;y<H;y+=40){ctx.moveTo(0,y);ctx.lineTo(W,y)}for(let x=(W/2)%40;x<W;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,H)}ctx.stroke();
 ctx.lineWidth=3;
 for(const o of obs){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);const c='hsl('+o.hue+',100%,62%)';ctx.strokeStyle=c;glow(c,14);ctx.beginPath();const s=o.size/2;
  if(o.kind==='sq')ctx.rect(-s,-s,s*2,s*2);else if(o.kind==='tri'){ctx.moveTo(0,-s*1.15);ctx.lineTo(s,s*.8);ctx.lineTo(-s,s*.8);ctx.closePath()}else ctx.arc(0,0,s,0,6.29);
  ctx.stroke();ctx.restore()}
 for(const it of items){ctx.save();ctx.translate(it.x,it.y);if(it.k==='gem'){const c='#4dffc3';glow(c,14);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(8,0);ctx.lineTo(0,10);ctx.lineTo(-8,0);ctx.closePath();ctx.fill()}
  else{const c='#6ac8ff';glow(c,16);ctx.strokeStyle=c;ctx.beginPath();ctx.arc(0,0,11,0,6.29);ctx.stroke();ctx.fillStyle=c;ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('S',0,1)}ctx.restore()}
 if(state!=='over'&&!(ship.inv>0&&Math.floor(ship.inv*12)%2)){const c='#00f0ff';glow(c,18);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(ship.x,ship.y-16);ctx.lineTo(ship.x+12,ship.y+12);ctx.lineTo(ship.x,ship.y+6);ctx.lineTo(ship.x-12,ship.y+12);ctx.closePath();ctx.fill();
  if(ship.shield){ctx.strokeStyle='rgba(106,200,255,.8)';ctx.beginPath();ctx.arc(ship.x,ship.y,22,0,6.29);ctx.stroke()}
  if(state==='play'){ctx.fillStyle='rgba(255,140,60,.8)';ctx.beginPath();ctx.arc(ship.x,ship.y+12+Math.random()*5,3,0,6.29);ctx.fill()}}
 ctx.shadowBlur=0;
 for(const q of parts){ctx.fillStyle='hsla('+q.hue+',100%,65%,'+Math.max(0,q.l*1.3)+')';ctx.fillRect(q.x-2,q.y-2,4,4)}
 if(state==='play'){text(String(score),W/2,48,40,'#fff');text('◆ '+gems,W-20,30,16,'#4dffc3','right',600)}
 if(state==='menu'){ctx.fillStyle='rgba(5,3,12,.7)';ctx.fillRect(0,0,W,H);glow('#ff3df0',20);text('NEON DODGE',W/2,H*.3,Math.min(54,W*.115),'#ff7af5');ctx.shadowBlur=0;
  text('Drag or use ← → to dodge. Grab ◆ for points.',W/2,H*.3+50,15,'#c8b8ff',null,400);text('Best: '+best,W/2,H*.3+78,16,'#8f7fd0',null,400);text('Tap to start',W/2,H*.3+120,18,'#fff',null,500)}
 if(state==='over'){ctx.fillStyle='rgba(5,3,12,.75)';ctx.fillRect(0,0,W,H);text('CRASHED',W/2,H*.32,Math.min(46,W*.1),'#ff5f8a');text(String(score),W/2,H*.32+62,62,'#fff');
  text(Math.floor(t)+' s survived · ◆ '+gems+' · Best '+best,W/2,H*.32+110,16,'#c8b8ff',null,400);if(overT>.6)text('Tap to play again',W/2,H*.32+150,18,'#00f0ff',null,500)}
}
loop(update,draw);
</script>
