name: SEO pages (auto)

on:
  push:
    branches: [main]
    paths: ['seo/**']
  schedule:
    - cron: '17 4 * * 1'   # щопонеділка — оновлює дати в sitemap і пінгує пошуковики
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate route pages
        run: python3 seo/generate.py
      - name: Commit
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add -A transfer transfers sitemap.xml seo/urls.txt
          git diff --cached --quiet || git commit -m "Auto-update SEO route pages"
          git push
      - name: Ping search engines (IndexNow — Bing, Yandex, Seznam, Naver)
        run: |
          KEY=$(cat seo/indexnow.key)
          python3 - "$KEY" <<'PY'
          import json, sys, urllib.request
          key = sys.argv[1]
          urls = [u.strip() for u in open('seo/urls.txt') if u.strip()][:10000]
          body = json.dumps({"host": "viptransferitaliy.com", "key": key,
                             "keyLocation": f"https://viptransferitaliy.com/{key}.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status)
          except Exception as e:
              print("IndexNow failed (not critical):", e)
          PY
